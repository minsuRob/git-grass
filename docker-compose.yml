services:
  postgres:
    image: postgres:17
    container_name: git-grass-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: github_dashboard
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d github_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 5
